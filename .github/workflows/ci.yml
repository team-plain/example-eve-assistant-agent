name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Not redundant with typecheck: it passed a channel that could not be imported at all.
      - run: npm test
      # The only check that catches an illegal channel or tool filename: discovery runs at build.
      - run: npm run build
